<svg xmlns="http://www.w3.org/2000/svg" width="860" height="160" viewBox="0 0 860 160" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="wbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111722"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
  </defs>
  <rect width="860" height="160" rx="12" fill="url(#wbg)"/>
  <rect x="0.5" y="0.5" width="859" height="159" rx="12" fill="none" stroke="#30363d" stroke-width="1"/>
  <line x1="0" y1="28" x2="860" y2="28" stroke="#30363d"/>

  <circle cx="18" cy="14" r="4.5" fill="#ff5f56"/>
  <circle cx="33" cy="14" r="4.5" fill="#ffbd2e"/>
  <circle cx="48" cy="14" r="4.5" fill="#27c93f"/>
  <text x="430" y="18" fill="#7d8590" font-size="11.5" text-anchor="middle">mandar1045@github: ~/opensource</text>
  
  <g fill="#c9d1d9" font-size="13" transform="translate(30, 60)">
    
    <style>
      .txt { fill: #c9d1d9; font-size: 13px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .hl { fill: #22d3ee; font-weight: bold; font-size: 14px;}
      .success { fill: #39d353; font-weight: bold; font-size: 12px;}
      .warn { fill: #f2cc60; font-weight: bold; font-size: 12px;}
      .dim { fill: #8b949e; font-size: 12px; }
      .cursor { fill: #c9d1d9; animation: blink 1s step-end infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .fade-in { opacity: 0; animation: fadeIn 0.5s forwards; }
      @keyframes fadeIn { to { opacity: 1; } }
      .card { fill: #161b22; stroke: #30363d; stroke-width: 1px; rx: 8px; }
    </style>
    
    <text class="txt" y="0" font-size="14px"><tspan fill="#39d353">mandar1045@github</tspan>:<tspan fill="#79c0ff">~</tspan>$ ./opensource.sh</text>

    <!-- Card 0 -->
    <g transform="translate(0, 30)" class="fade-in" style="animation-delay: 0.2s">
      <rect class="card" width="380" height="70" />
      <image href="data:image/png;base64," x="20" y="15" width="24" height="24" style="border-radius: 4px;" />
      <text class="hl" x="52" y="32">supabase</text>
      <text class="success" x="20" y="52">✓ 7 Merged PRs</text>
    </g>
    <!-- Card 1 -->
    <g transform="translate(420, 30)" class="fade-in" style="animation-delay: 0.30000000000000004s">
      <rect class="card" width="380" height="70" />
      <image href="data:image/png;base64," x="20" y="15" width="24" height="24" style="border-radius: 4px;" />
      <text class="hl" x="52" y="32">fossology</text>
      <text class="success" x="20" y="52">✓ 8 Merged PRs</text>
    </g>
    <g transform="translate(0, 120)" class="fade-in" style="animation-delay: 0.4s">
      <text class="txt" y="0" font-size="14px"><tspan fill="#39d353">mandar1045@github</tspan>:<tspan fill="#79c0ff">~</tspan>$ <tspan class="cursor">█</tspan></text>
    </g>
    
  </g>
</svg>