      <text class="txt" y="25" x="20">Go         [||||||||||||||||||] 90%</text>
      <text class="txt" y="45" x="20">Python     [||||||||||||||||| ] 85%</text>
      <text class="txt" y="65" x="20">TypeScript [||||||||||||||||  ] 80%</text>
