<svg xmlns="http://www.w3.org/2000/svg" width="420" height="200" viewBox="0 0 420 200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="wbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111722"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
  </defs>
  <rect width="420" height="200" rx="12" fill="url(#wbg)"/>
  <rect x="0.5" y="0.5" width="419" height="199" rx="12" fill="none" stroke="#30363d" stroke-width="1"/>
  <line x1="0" y1="28" x2="420" y2="28" stroke="#30363d"/>

  <circle cx="18" cy="14" r="4.5" fill="#ff5f56"/>
  <circle cx="33" cy="14" r="4.5" fill="#ffbd2e"/>
  <circle cx="48" cy="14" r="4.5" fill="#27c93f"/>
  <text x="210" y="18" fill="#7d8590" font-size="11.5" text-anchor="middle">~/projects/continum</text>
  
  <g fill="#c9d1d9" font-size="13" transform="translate(30, 60)">
    
    <style>
      .txt { fill: #c9d1d9; font-size: 14px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .hl { fill: #22d3ee; font-weight: bold; font-size: 16px;}
      .dim { fill: #8b949e; font-size: 13px;}
      .fade-in { opacity: 0; animation: fadeIn 0.5s forwards; }
      @keyframes fadeIn { to { opacity: 1; } }
      .card { fill: #161b22; stroke: #30363d; stroke-width: 1px; rx: 8px; }
    </style>
    
    <text class="txt" y="0"><tspan fill="#39d353">mandar1045</tspan>:<tspan fill="#79c0ff">~/projects</tspan>$ cat continum.md</text>

    <g transform="translate(0, 30)" class="fade-in" style="animation-delay: 0.2s">
      <rect class="card" width="380" height="90" />
      <text class="hl" x="20" y="30">🤖 Continum</text>
      <text class="dim" x="20" y="55">AI/ML Automation Platform</text>
      <text class="txt" x="20" y="75" font-size="12px">• NLP Email Triage Engine</text>
    </g>
    
  </g>
</svg>